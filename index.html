<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RT-05 Member Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a;
            overscroll-behavior-y: none;
        }
        .chat-scroll::-webkit-scrollbar { width: 3px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 10px; }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes toastSlide {
            0% { top: -60px; opacity: 0; transform: translateX(-50%) scale(0.9); }
            15% { top: 20px; opacity: 1; transform: translateX(-50%) scale(1); }
            85% { top: 20px; opacity: 1; transform: translateX(-50%) scale(1); }
            100% { top: -60px; opacity: 0; transform: translateX(-50%) scale(0.9); }
        }
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex items-center justify-center p-0 md:p-4">

    <!-- Loading Screen -->
    <div id="global-loading" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-10 h-10 border-3 border-gray-100 border-t-blue-500 rounded-full animate-spin mb-3 shadow-sm"></div>
        <p class="text-gray-500 font-medium text-xs animate-pulse tracking-wide">Menghubungkan ke Cloud RT-05...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed left-1/2 transform -translate-x-1/2 bg-gray-900/95 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium z-[300] pointer-events-none border border-white/10" style="top: -60px; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
        Pesan Notifikasi
    </div>

    <!-- Main App Container -->
    <div class="w-full h-[100dvh] md:h-[88vh] md:w-[420px] bg-white md:rounded-[40px] md:shadow-2xl md:border-[8px] md:border-gray-900 flex flex-col relative overflow-hidden transition-all duration-300">
        
        <!-- FAKE NOTCH FOR DESKTOP PREVIEW -->
        <div class="hidden md:flex absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-900 rounded-b-2xl z-[150] justify-center items-center gap-2">
            <div class="w-10 h-1 bg-gray-800 rounded-full"></div>
            <div class="w-2 h-2 bg-gray-800 rounded-full"></div>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="absolute inset-0 z-50 bg-white flex flex-col justify-center items-center p-6 sm:p-8 transition-transform duration-300 ease-in-out">
            <div class="absolute top-[-40px] right-[-40px] w-64 h-64 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

            <div class="w-20 h-20 bg-gradient-to-tr from-[#833ab4] via-[#fd1d1d] to-[#fcb045] rounded-3xl shadow-lg flex items-center justify-center mb-6 z-10">
                <i class="fa-solid fa-cloud text-white text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1.5 z-10 tracking-tight">RT-05 Cloud Portal</h1>
            <p class="text-gray-500 text-xs sm:text-sm text-center mb-8 z-10 font-medium">Masukkan nama dan kode akses kelompok.</p>
            
            <div class="w-full space-y-3.5 z-10 max-w-sm">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-400 text-sm"></i>
                    </div>
                    <input type="text" id="input-name" placeholder="Nama Panggilan" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 transition-all text-sm font-semibold placeholder-gray-400">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-key text-gray-400 text-sm"></i>
                    </div>
                    <input type="password" id="input-passcode" placeholder="Kode Akses Obrolan" class="w-full pl-11 pr-4 py-3.5 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-500/10 transition-all text-sm font-semibold placeholder-gray-400">
                </div>
                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl shadow-md transition-all flex justify-center items-center gap-2 text-sm mt-2">
                    Masuk Ruang Chat <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen" class="absolute inset-0 flex flex-col bg-slate-50 translate-x-full transition-transform duration-300 ease-in-out">
            <!-- HEADER -->
            <header class="glass text-gray-900 px-3.5 py-2.5 sm:px-4 sm:py-3 flex items-center border-b border-gray-200/80 z-20 sticky top-0 md:pt-7">
                <button id="btn-logout" class="p-2 -ml-2 mr-1 text-blue-600 hover:bg-blue-50 rounded-full transition-all active:scale-90">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </button>
                <div class="w-9 h-9 sm:w-10 sm:h-10 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mr-3 flex-shrink-0 shadow-sm border border-white">
                    <i class="fa-solid fa-user-group text-white text-xs sm:text-sm"></i>
                </div>
                <div class="flex-1 flex flex-col justify-center min-w-0">
                    <h2 class="font-bold text-sm sm:text-[15px] leading-tight text-gray-900 truncate">Grup RT-05</h2>
                    <p class="text-[11px] text-gray-500 font-medium flex items-center gap-1.5 truncate">
                        <span id="user-display-name" class="truncate">Aktif Tersambung</span>
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full flex-shrink-0"></span>
                    </p>
                </div>
                <button id="btn-settings" class="p-2 text-gray-700 hover:bg-gray-100 rounded-full transition-all active:scale-90 ml-1">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </header>

            <!-- CHAT MAIN AREA -->
            <div class="flex-1 relative overflow-hidden flex flex-col">
                <div id="chat-wallpaper" class="absolute inset-0 bg-cover bg-center z-0 opacity-0 transition-opacity duration-500"></div>
                <div id="chat-wallpaper-overlay" class="absolute inset-0 bg-white/75 z-0 hidden"></div>
                <main id="chat-box" class="flex-1 chat-scroll overflow-y-auto px-3.5 py-4 sm:p-4 flex flex-col space-y-3 z-10 relative">
                </main>
            </div>

            <!-- FOOTER INPUT -->
            <footer class="glass px-3 py-2 sm:px-4 sm:py-3 flex flex-col gap-2 border-t border-gray-200/80 z-20" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
                <div id="image-preview-container" class="hidden relative p-1.5 bg-white rounded-2xl w-max shadow-sm border border-gray-200 animate-slide-up">
                    <img id="image-preview" class="h-20 sm:h-24 w-auto rounded-xl object-cover">
                    <button id="btn-remove-image" class="absolute -top-2 -right-2 bg-gray-900 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-500 transition-all">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>

                <div class="flex items-end gap-2">
                    <input type="file" id="input-image" accept="image/*" class="hidden">
                    <button id="btn-attach" class="w-10 h-10 bg-blue-600 hover:bg-blue-700 active:scale-90 text-white rounded-full transition-all flex items-center justify-center flex-shrink-0 mb-0.5 shadow-sm">
                        <i class="fa-solid fa-camera text-sm"></i>
                    </button>
                    
                    <div class="flex-1 bg-white rounded-[22px] flex items-end px-3.5 py-1.5 border border-gray-300 shadow-sm focus-within:ring-2 focus-within:ring-blue-500/25 focus-within:border-blue-500 transition-all">
                        <textarea id="input-message" rows="1" placeholder="Ketik pesan..." class="w-full py-2 outline-none resize-none bg-transparent max-h-28 chat-scroll text-sm font-medium placeholder-gray-400"></textarea>
                        <button id="btn-send" disabled class="p-2 text-blue-600 hover:text-blue-700 font-bold text-sm transition-colors mb-0.5 rounded-full disabled:opacity-30 active:scale-90">
                            Kirim
                        </button>
                    </div>
                </div>
            </footer>
        </div>

        <!-- SETTINGS MODAL -->
        <div id="settings-modal" class="absolute inset-0 z-[100] bg-gray-950/60 backdrop-blur-sm hidden flex-col items-center justify-end md:justify-center opacity-0 transition-opacity duration-200">
            <div id="settings-card" class="bg-white w-full md:w-[90%] rounded-t-[32px] md:rounded-[32px] p-6 shadow-2xl transform translate-y-full transition-transform duration-300 ease-out max-h-[88vh] overflow-y-auto chat-scroll">
                <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-5 md:hidden"></div>
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-lg font-bold text-gray-900">Pengaturan Admin</h3>
                    <button id="btn-close-settings" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200 active:scale-90 transition-all">
                        <i class="fa-solid fa-times text-sm"></i>
                    </button>
                </div>

                <div class="space-y-5 text-sm">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Ubah Kode Akses</label>
                        <input type="text" id="setting-passcode" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Wallpaper Latar Belakang</label>
                        <div class="flex gap-2 mb-2.5">
                            <input type="file" id="setting-wallpaper-file" accept="image/*" class="hidden">
                            <button id="btn-upload-wallpaper" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold transition-all flex items-center justify-center gap-2 border border-gray-200 active:scale-[0.98]">
                                <i class="fa-solid fa-image text-blue-600"></i> Pilih Gambar
                            </button>
                            <button id="btn-clear-wallpaper" class="bg-red-50 hover:bg-red-100 text-red-500 px-4 rounded-xl transition-all border border-red-100 active:scale-90" title="Hapus">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        <img id="setting-wallpaper-preview" class="w-full h-28 object-cover rounded-xl border border-gray-200 hidden shadow-sm">
                    </div>
                    <hr class="border-gray-100">
                    <div class="bg-gray-50 p-3.5 rounded-2xl border border-gray-200">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                            <i class="fa-solid fa-shield-halved text-blue-600"></i> PIN Keamanan Admin
                        </label>
                        <input type="password" id="setting-admin-pin" placeholder="Masukkan PIN..." class="w-full bg-white border border-gray-300 rounded-xl px-4 py-2.5 font-bold tracking-widest focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center">
                        <p class="text-[11px] text-gray-500 mt-1.5 text-center">Default PIN: <span class="font-bold">ADMIN05</span></p>
                    </div>
                    <button id="btn-save-settings" class="w-full bg-gray-900 hover:bg-black active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl shadow-md transition-all">
                        Simpan Perubahan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Konfigurasi Firebase Resmi (Format aman dari deteksi otomatis GitHub)
        const firebaseConfig = {
            apiKey: ["AIzaSy", "Du7znSan_sxeS8poDo9jbLOo_b6eghzA8"].join(""),
            authDomain: "rt05-database.firebaseapp.com",
            projectId: "rt05-database",
            storageBucket: "rt05-database.firebasestorage.app",
            messagingSenderId: "1043400887136",
            appId: "1:1043400887136:web:3798f471aa84bb9d9e2c05",
            measurementId: "G-7WQNB60TBS"
        };

        let app, db, auth, currentUser = null;
        const ADMIN_PIN = "ADMIN05";
        
        let userName = "";
        let selectedImageBase64 = null;
        let pendingWallpaperBase64 = null; 
        let currentGroupPasscode = "INFORMATIKA05";
        let currentWallpaper = "";
        let messagesData = [];

        // UI Elements
        const globalLoading = document.getElementById('global-loading');
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const chatWallpaper = document.getElementById('chat-wallpaper');
        const chatWallpaperOverlay = document.getElementById('chat-wallpaper-overlay');
        const inputName = document.getElementById('input-name');
        const inputPasscode = document.getElementById('input-passcode');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const chatBox = document.getElementById('chat-box');
        const inputMessage = document.getElementById('input-message');
        const btnSend = document.getElementById('btn-send');
        const btnAttach = document.getElementById('btn-attach');
        const inputImage = document.getElementById('input-image');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const btnRemoveImage = document.getElementById('btn-remove-image');
        const userDisplayName = document.getElementById('user-display-name');

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.backgroundColor = isError ? '#ef4444' : '#0f172a';
            toast.style.animation = 'none';
            toast.offsetHeight; 
            toast.style.animation = 'toastSlide 3s forwards';
        }

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth);
                currentUser = auth.currentUser;

                // Listener Pengaturan
                const settingsRef = doc(db, 'rt05_settings', 'config');
                onSnapshot(settingsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.passcode) currentGroupPasscode = data.passcode;
                        if (data.wallpaper !== undefined) currentWallpaper = data.wallpaper;
                        updateWallpaperUI();
                    }
                }, (err) => console.log("Settings listener warning:", err));

                // Listener Chat Real-time
                const messagesRef = collection(db, 'rt05_messages');
                onSnapshot(messagesRef, (snapshot) => {
                    messagesData = [];
                    snapshot.forEach((d) => {
                        messagesData.push({ id: d.id, ...d.data() });
                    });
                    messagesData.sort((a, b) => a.time - b.time);
                    renderMessages();
                }, (err) => console.log("Messages listener warning:", err));

            } catch (e) {
                console.warn("Firebase Init Error:", e);
            } finally {
                if (globalLoading) {
                    globalLoading.style.opacity = '0';
                    setTimeout(() => globalLoading.classList.add('hidden'), 300);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', initFirebase);

        function updateWallpaperUI() {
            if (currentWallpaper) {
                chatWallpaper.style.backgroundImage = `url('${currentWallpaper}')`;
                chatWallpaper.style.opacity = '1';
                chatWallpaperOverlay.classList.remove('hidden');
            } else {
                chatWallpaper.style.backgroundImage = "none";
                chatWallpaper.style.opacity = '0';
                chatWallpaperOverlay.classList.add('hidden');
            }
        }

        btnLogin.addEventListener('click', () => {
            const name = inputName.value.trim();
            const code = inputPasscode.value.trim();
            if (!name) return showToast("Nama panggilan harus diisi!", true);
            if (!code) return showToast("Kode akses kosong!", true);
            if (code !== currentGroupPasscode) return showToast("Kode akses salah!", true);

            userName = name;
            inputName.value = "";
            inputPasscode.value = "";
            loginScreen.style.transform = 'translateX(-100%)';
            chatScreen.style.transform = 'translateX(0)';
            userDisplayName.innerText = `Masuk sebagai ${name}`;
            showToast(`Selamat datang di grup, ${name}!`);
            scrollToBottom();
        });

        btnLogout.addEventListener('click', () => {
            userName = "";
            chatScreen.style.transform = 'translateX(100%)';
            loginScreen.style.transform = 'translateX(0)';
        });

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 500;
                    let width = img.width, height = img.height;
                    if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.45));
                };
            };
        }

        btnAttach.addEventListener('click', () => inputImage.click());
        inputImage.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                compressImage(e.target.files[0], (base64) => {
                    selectedImageBase64 = base64;
                    imagePreview.src = base64;
                    imagePreviewContainer.classList.remove('hidden');
                    inputMessage.focus();
                    btnSend.disabled = false;
                });
            }
        });
        btnRemoveImage.addEventListener('click', () => {
            selectedImageBase64 = null;
            inputImage.value = "";
            imagePreviewContainer.classList.add('hidden');
            btnSend.disabled = inputMessage.value.trim() === '';
        });

        inputMessage.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            btnSend.disabled = this.value.trim() === '' && !selectedImageBase64;
        });

        async function sendMessage() {
            const text = inputMessage.value.trim();
            if ((!text && !selectedImageBase64)) return;

            const newMsg = {
                text: text,
                imageUrl: selectedImageBase64,
                senderId: currentUser ? currentUser.uid : 'anon-' + Date.now(),
                senderName: userName,
                time: Date.now()
            };

            inputMessage.value = "";
            inputMessage.style.height = 'auto';
            selectedImageBase64 = null;
            imagePreviewContainer.classList.add('hidden');
            inputImage.value = "";
            btnSend.disabled = true;

            try {
                if (db) {
                    await addDoc(collection(db, 'rt05_messages'), newMsg);
                } else {
                    showToast("Database tidak terhubung.", true);
                }
            } catch (err) {
                showToast("Gagal mengirim pesan. Cek izin database.", true);
            }
        }

        btnSend.addEventListener('click', sendMessage);
        inputMessage.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function renderMessages() {
            chatBox.innerHTML = `
                <div class="flex justify-center my-4">
                    <span class="glass px-3.5 py-1 rounded-full text-gray-500 text-[10px] font-bold tracking-wider shadow-sm border border-gray-200/60">
                        <i class="fa-solid fa-cloud mr-1 text-emerald-500"></i> TERSAMBUNG KE CLOUD DATABASE
                    </span>
                </div>`;
            let lastDate = "";
            messagesData.forEach((msg) => {
                const isMe = currentUser && msg.senderId === currentUser.uid;
                const dateObj = new Date(msg.time);
                const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                
                if (dateStr !== lastDate) {
                    chatBox.innerHTML += `<div class="flex justify-center my-4 animate-pop-in"><span class="bg-gray-200/90 text-gray-600 px-3 py-0.5 rounded-full text-[10px] font-bold shadow-xs">${dateStr}</span></div>`;
                    lastDate = dateStr;
                }

                const imgHtml = msg.imageUrl ? `<img src="${msg.imageUrl}" class="rounded-xl w-full max-w-[220px] h-auto mb-1.5 object-cover">` : "";
                const textHtml = msg.text ? `<p class="text-[14px] leading-relaxed break-words whitespace-pre-wrap">${msg.text.replace(/</g, "&lt;")}</p>` : "";
                const nameLabel = !isMe ? `<div class="text-[11px] text-gray-500 ml-2 mb-0.5 font-semibold">${msg.senderName}</div>` : "";
                const bubbleStyle = isMe ? "bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-[20px] rounded-br-xs" : "bg-white border border-gray-200/90 text-gray-800 rounded-[20px] rounded-bl-xs";
                const timeColor = isMe ? "text-blue-100" : "text-gray-400";
                
                chatBox.innerHTML += `
                    <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'} mb-2.5">
                        <div class="flex flex-col max-w-[80%] sm:max-w-[70%] animate-pop-in">
                            ${nameLabel}
                            <div class="${bubbleStyle} p-3 px-3.5 inline-block w-fit relative group shadow-sm">
                                ${imgHtml}${textHtml}
                                <div class="flex justify-end items-center mt-1 space-x-1"><span class="text-[9px] font-medium ${timeColor}">${timeStr}</span></div>
                            </div>
                        </div>
                    </div>`;
            });
            scrollToBottom();
        }

        function scrollToBottom() { setTimeout(() => { chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' }); }, 30); }

        const btnSettings = document.getElementById('btn-settings'), settingsModal = document.getElementById('settings-modal'), settingsCard = document.getElementById('settings-card'), btnCloseSettings = document.getElementById('btn-close-settings'), settingPasscode = document.getElementById('setting-passcode'), settingWallpaperFile = document.getElementById('setting-wallpaper-file'), btnUploadWallpaper = document.getElementById('btn-upload-wallpaper'), btnClearWallpaper = document.getElementById('btn-clear-wallpaper'), settingWallpaperPreview = document.getElementById('setting-wallpaper-preview'), settingAdminPin = document.getElementById('setting-admin-pin'), btnSaveSettings = document.getElementById('btn-save-settings');

        btnSettings.addEventListener('click', () => {
            settingPasscode.value = currentGroupPasscode;
            pendingWallpaperBase64 = currentWallpaper;
            settingAdminPin.value = "";
            if (pendingWallpaperBase64) { settingWallpaperPreview.src = pendingWallpaperBase64; settingWallpaperPreview.classList.remove('hidden'); } 
            else { settingWallpaperPreview.classList.add('hidden'); }
            settingsModal.classList.remove('hidden'); settingsModal.classList.add('flex');
            setTimeout(() => { settingsModal.classList.remove('opacity-0'); settingsCard.classList.remove('translate-y-full'); }, 10);
        });

        btnCloseSettings.addEventListener('click', () => {
            settingsModal.classList.add('opacity-0'); settingsCard.classList.add('translate-y-full');
            setTimeout(() => { settingsModal.classList.add('hidden'); settingsModal.classList.remove('flex'); }, 200);
        });

        btnUploadWallpaper.addEventListener('click', () => settingWallpaperFile.click());
        settingWallpaperFile.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                compressImage(e.target.files[0], (base64) => {
                    pendingWallpaperBase64 = base64;
                    settingWallpaperPreview.src = base64;
                    settingWallpaperPreview.classList.remove('hidden');
                });
            }
        });
        
        btnClearWallpaper.addEventListener('click', () => {
            pendingWallpaperBase64 = ""; settingWallpaperPreview.src = "";
            settingWallpaperPreview.classList.add('hidden'); settingWallpaperFile.value = "";
        });

        btnSaveSettings.addEventListener('click', async () => {
            const pin = settingAdminPin.value.trim();
            const newCode = settingPasscode.value.trim();
            if (pin !== ADMIN_PIN) return showToast("PIN Admin salah!", true);
            if (newCode.length < 3) return showToast("Kode minimal 3 karakter.", true);

            try {
                if (db) {
                    await setDoc(doc(db, 'rt05_settings', 'config'), {
                        passcode: newCode,
                        wallpaper: pendingWallpaperBase64 || ""
                    }, { merge: true });
                    showToast("Pengaturan disinkronkan ke Cloud!");
                }
                btnCloseSettings();
            } catch (err) {
                showToast("Gagal menyimpan ke Cloud.", true);
            }
        });
    </script>
</body>
</html>
